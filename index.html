<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Me 🐰</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --miffy-yellow: #ffde59;
      --miffy-blue: #4a90e2;
      --miffy-orange: #ff914d;
      --miffy-red: #ff5757;
      --miffy-bg: #fffbf0;
      --miffy-dark: #222222;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--miffy-bg);
      font-family: 'Nunito', sans-serif;
      color: var(--miffy-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card-container {
      background: #ffffff;
      border: 4px solid var(--miffy-dark);
      border-radius: 24px;
      max-width: 420px;
      width: 100%;
      padding: 30px 24px;
      box-shadow: 8px 8px 0px var(--miffy-dark);
      text-align: center;
      position: relative;
    }

    /* Miffy Face Element */
    .miffy-face {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
      position: relative;
    }

    .ears {
      display: flex;
      justify-content: center;
      gap: 12px;
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
    }

    .ear {
      width: 18px;
      height: 40px;
      background: white;
      border: 3.5px solid var(--miffy-dark);
      border-radius: 20px;
    }

    .head {
      width: 70px;
      height: 60px;
      background: white;
      border: 3.5px solid var(--miffy-dark);
      border-radius: 50%;
      margin: 12px auto 0;
      position: relative;
    }

    .eyes {
      display: flex;
      justify-content: space-between;
      width: 28px;
      position: absolute;
      top: 22px;
      left: 18px;
    }

    .eye {
      width: 6px;
      height: 6px;
      background: var(--miffy-dark);
      border-radius: 50%;
    }

    .mouth {
      position: absolute;
      top: 26px;
      left: 28px;
      font-weight: bold;
      font-size: 14px;
      line-height: 1;
      color: var(--miffy-dark);
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: 1.8rem;
      color: var(--miffy-orange);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--miffy-blue);
      margin-bottom: 20px;
    }

    .bio {
      font-size: 0.9rem;
      line-height: 1.5;
      background: #f7f9fc;
      border: 2px dashed var(--miffy-blue);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: block;
      padding: 12px;
      border: 3px solid var(--miffy-dark);
      border-radius: 14px;
      font-weight: 700;
      text-decoration: none;
      color: var(--miffy-dark);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      box-shadow: 4px 4px 0px var(--miffy-dark);
    }

    .link-btn:nth-child(1) { background-color: var(--miffy-yellow); }
    .link-btn:nth-child(2) { background-color: var(--miffy-blue); color: white; }
    .link-btn:nth-child(3) { background-color: var(--miffy-red); color: white; }

    .link-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--miffy-dark);
    }

    .link-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--miffy-dark);
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- CSS Miffy Face -->
    <div class="miffy-face">
      <div class="ears">
        <div class="ear"></div>
        <div class="ear"></div>
      </div>
      <div class="head">
        <div class="eyes">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
        <div class="mouth">✕</div>
      </div>
    </div>

    <h1>Hello, I'm [Your Name]! 🐰</h1>
    <p class="subtitle">welcome to my cozy corner</p>

    <p class="bio">
      ✨ Lover of simple designs, warm tea, and primary colors. Welcome to my personal page!
    </p>

    <div class="links">
      <a href="https://instagram.com" class="link-btn" target="_blank">Instagram 🌸</a>
      <a href="https://twitter.com" class="link-btn" target="_blank">Twitter ☁️</a>
      <a href="mailto:your-email@example.com" class="link-btn" target="_blank">Contact Me ✉️</a>
    </div>
  </div>

</body>
</html>
